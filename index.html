<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/resumebuilder/favicon.svg" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Resume Builder</title>
    <script type="module" crossorigin src="/resumebuilder/assets/index-BSTYxngM.js"></script>
    <link rel="stylesheet" crossorigin href="/resumebuilder/assets/index-AtYE4UcO.css">
  <link rel="manifest" href="/resumebuilder/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <header class="topbar no-print">
        <h1 class="app-title">Offline Resume Builder</h1>
        <div class="topbar-controls">
          <select id="template-select" aria-label="Template"></select>
          <button id="customize-btn" type="button">Customize</button>
          <button id="history-btn" type="button" title="View and restore previously saved versions of this resume">History</button>
          <button id="load-json-btn" type="button" title="Import a PDF, DOCX, or JSON resume. PDF/DOCX are auto-parsed and may need review — JSON loads exactly as-is.">Import Resume</button>
          <input id="load-json-input" type="file" accept=".json,application/json,.pdf,application/pdf,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
          <button id="download-json-btn" type="button">Download JSON</button>
          <button id="export-pdf-btn" type="button" class="primary">Export to PDF</button>
        </div>
      </header>

      <nav class="tabs no-print" role="tablist">
        <button id="tab-edit" class="tab-button is-active" role="tab" aria-selected="true">Edit JSON</button>
        <button id="tab-preview" class="tab-button" role="tab" aria-selected="false">Preview</button>
      </nav>

      <div id="info-banner" class="info-banner no-print" hidden>
        <span id="info-banner-text"></span>
        <button id="info-banner-close" type="button" class="info-banner-close" aria-label="Dismiss">&times;</button>
      </div>
      <div id="error-banner" class="error-banner no-print" hidden></div>

      <dialog id="style-dialog" class="style-dialog no-print">
        <div id="style-dialog-header" class="style-dialog-header">
          <h2>Customize</h2>
        </div>
        <form method="dialog" class="style-form">
          <fieldset>
            <legend>Layout</legend>
            <label class="style-row">
              <span>Margin</span>
              <input id="style-margin" type="range" min="0.25" max="1.5" step="0.05" />
              <output id="style-margin-value" for="style-margin"></output>
            </label>
            <label class="style-row">
              <span>Spacing</span>
              <input id="style-spacing" type="range" min="0.5" max="2" step="0.05" />
              <output id="style-spacing-value" for="style-spacing"></output>
            </label>
            <label class="style-row">
              <span>Line height</span>
              <input id="style-line-height" type="range" min="1" max="2" step="0.05" />
              <output id="style-line-height-value" for="style-line-height"></output>
            </label>
          </fieldset>

          <fieldset>
            <legend>Header (name, title, contact)</legend>
            <label class="style-row">
              <span>Font</span>
              <select id="style-header-font"></select>
            </label>
            <label class="style-row">
              <span>Size</span>
              <input id="style-header-size" type="range" min="0.7" max="1.5" step="0.05" />
              <output id="style-header-size-value" for="style-header-size"></output>
            </label>
            <label class="style-row">
              <span>Color</span>
              <input id="style-header-color" type="color" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Section headings</legend>
            <label class="style-row">
              <span>Font</span>
              <select id="style-heading-font"></select>
            </label>
            <label class="style-row">
              <span>Size</span>
              <input id="style-heading-size" type="range" min="0.7" max="1.5" step="0.05" />
              <output id="style-heading-size-value" for="style-heading-size"></output>
            </label>
            <label class="style-row">
              <span>Color</span>
              <input id="style-heading-color" type="color" />
            </label>
          </fieldset>

          <fieldset>
            <legend>Body text</legend>
            <label class="style-row">
              <span>Font</span>
              <select id="style-body-font"></select>
            </label>
            <label class="style-row">
              <span>Size</span>
              <input id="style-body-size" type="range" min="0.7" max="1.5" step="0.05" />
              <output id="style-body-size-value" for="style-body-size"></output>
            </label>
            <label class="style-row">
              <span>Color</span>
              <input id="style-body-color" type="color" />
            </label>
          </fieldset>

          <div class="style-dialog-actions">
            <button id="style-reset-btn" type="button">Reset to defaults</button>
            <button id="style-autofit-btn" type="button" title="Shrinks spacing, line height, and font size until the resume fits one page">Auto-fit to page</button>
            <button type="submit" class="primary">Done</button>
          </div>
        </form>
      </dialog>

      <dialog id="history-dialog" class="history-dialog no-print">
        <div id="history-dialog-header" class="style-dialog-header">
          <h2>History</h2>
        </div>
        <form method="dialog" class="history-form">
          <label class="style-row">
            <span>Version</span>
            <select id="history-select"></select>
          </label>
          <div id="history-diff" class="history-diff"></div>
          <div class="style-dialog-actions">
            <button id="history-restore-btn" type="button">Restore this version</button>
            <button type="submit" class="primary">Done</button>
          </div>
        </form>
      </dialog>

      <main class="layout">
        <section id="editor-pane" class="editor-pane no-print">
          <nav class="editor-tabs" role="tablist">
            <button id="tab-form" class="editor-tab-button is-active" role="tab" aria-selected="true">Form</button>
            <button id="tab-source" class="editor-tab-button" role="tab" aria-selected="false">JSON</button>
          </nav>
          <div class="editor-wrap" hidden>
            <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
            <div class="editor-textarea-wrap">
              <div id="error-line-highlight" class="error-line-highlight" aria-hidden="true"></div>
              <textarea id="json-editor" spellcheck="false" wrap="off" aria-label="Resume JSON"></textarea>
            </div>
          </div>
          <div id="form-editor" class="form-editor"></div>
        </section>

        <section id="preview-pane" class="preview-pane">
          <div id="page-scale-wrapper" class="page-scale-wrapper">
            <div id="page" class="page">
              <div id="preview"></div>
            </div>
          </div>
        </section>
      </main>

      <div id="format-toolbar" class="format-toolbar no-print" hidden>
        <button type="button" data-format="bold" title="Bold"><strong>B</strong></button>
        <button type="button" data-format="italic" title="Italic"><em>I</em></button>
        <button type="button" data-format="reset" title="Remove formatting">Reset</button>
      </div>

      <footer class="footer no-print">
        <p>Your data never leaves this browser — nothing is uploaded, no analytics, no server. Works fully offline.</p>
      </footer>
    </div>
  </body>
</html>
