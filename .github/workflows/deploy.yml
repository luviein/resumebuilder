name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets this workflow push the built site to the gh-pages branch.
permissions:
  contents: write

# Only one deployment at a time; let in-progress runs finish rather than cancelling them mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build (typecheck + Vite build)
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Force-pushes dist/ to the gh-pages branch, creating it on the first run if it doesn't exist.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
